<div class="absolute inset-0 bg-gray-900/40" data-qs-backdrop></div>
<div class="relative mx-auto mt-16 w-full max-w-2xl px-4">
  <div
    class="overflow-hidden rounded-lg bg-white shadow-2xl"
    role="dialog"
    aria-modal="true"
    aria-label="Quick search"
  >
    <div class="relative border-b border-gray-200">
      <label for="quick-search-input" class="sr-only">{{labelText}}</label>
      <input
        id="quick-search-input"
        type="text"
        autocomplete="off"
        class="peer block w-full border-0 py-3 pl-10 pr-16 text-sm outline-none placeholder:text-gray-500"
        placeholder="{{attrPlaceholder}}"
        role="combobox"
        aria-expanded="true"
        aria-controls="quick-search-results"
        aria-autocomplete="list"
        data-event-type="quickSearch"
        data-btn-type="query"
      />
      {{svgMagnifyingGlass}}
      <span
        class="absolute right-3 top-1/2 -translate-y-1/2 rounded border border-gray-200 px-1.5 py-0.5 text-xs text-gray-400"
        aria-hidden="true"
        >esc</span
      >
    </div>
    <div
      id="quick-search-results"
      class="max-h-[60vh] overflow-y-auto overscroll-contain"
      role="listbox"
      aria-label="Search results"
      data-slot="qs-results"
    ></div>
  </div>
</div>
