AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  SpyneJS Acme dashboard — static SPA on S3 + CloudFront, API tier on Lambda.

  ── Why ONE distribution and not two origins on two hostnames ──────────────

  The session cookie is httpOnly; secure; sameSite=lax, and the app fetches the
  API as the relative path /api (AcmeDbConnectionsTraits.acmeDbConnections$GetApiBase).
  Serving the API from a second hostname would make every request cross-site:
  the cookie would stop being sent, and restoring it would mean CORS plus
  credentials:'include' plus sameSite=none — weakening the security posture for
  a hosting reason, and changing app code to suit a deployment.

  So CloudFront owns the hostname and routes by path: /api/* to the Lambda,
  everything else to S3. The app ships unchanged and the cookie stays first-party.

Parameters:
  DomainName:
    Type: String
    Default: acme-dashboard.spynejs.com
    Description: Public hostname. Must sit inside HostedZoneId below.
  HostedZoneId:
    Type: String
    Default: ZPB47SSBRJ5KC
    Description: Route53 zone for spynejs.com.
  PostgresUrl:
    Type: String
    NoEcho: true
    Description: Neon connection string. Passed at deploy time, never committed.
  AuthSecret:
    Type: String
    NoEcho: true
    Description: Session-cookie signing secret. Same value as the Next.js app.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs22.x
    Architectures: [x86_64]

Resources:
  # ── API tier ──────────────────────────────────────────────────────────────
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: server/
      Handler: lambda.handler
      Description: Express app from create-app.js, wrapped by serverless-http.
      Environment:
        Variables:
          POSTGRES_URL: !Ref PostgresUrl
          AUTH_SECRET: !Ref AuthSecret
          # A function container serves one request at a time, so a pool larger
          # than one holds Neon connections open for nothing — and concurrent
          # cold starts multiply that until Neon refuses new ones. See db.js.
          PG_POOL_MAX: '1'
          PG_IDLE_TIMEOUT: '20'
      FunctionUrlConfig:
        # NONE, deliberately — and this replaced an OAC + AWS_IAM design that
        # was measured to fail. With OAC, CloudFront SigV4-signs origin
        # requests, and for POST/PUT to a Lambda Function URL the signature
        # must cover the payload — which requires the VIEWER to send
        # x-amz-content-sha256. Browsers never will, so every login POST died
        # as a 403 that the SPA error rewrite then masked as index.html/200.
        # GETs signed fine, which made it look like a cookie bug.
        #
        # The API's real gate is its own session auth, same as everywhere
        # else. Cost of NONE: the Function URL is directly addressable,
        # bypassing CloudFront; acceptable here, note for hardening (secret
        # origin header + WAF) if this ever fronts something real.
        AuthType: NONE
        InvokeMode: BUFFERED

  # ── Static bundle ─────────────────────────────────────────────────────────
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      # No public access and no website endpoint: CloudFront reaches the bucket
      # through OAC, so the objects are never addressable except through the
      # distribution.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  SiteOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-s3-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── Certificate ───────────────────────────────────────────────────────────
  #
  # CloudFront only accepts certificates from us-east-1, which is why the stack
  # deploys there. CloudFormation writes the DNS validation record into the zone
  # itself and waits — so this resource blocks the first deploy for a few
  # minutes and is instant on every one after.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # ── Distribution ──────────────────────────────────────────────────────────
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases: [!Ref DomainName]
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOac.Id
            S3OriginConfig: {}
          - Id: api
            # The Function URL host, with the scheme stripped — CloudFront wants
            # a bare domain and !GetAtt returns https://<id>.lambda-url...
            DomainName: !Select [2, !Split ['/', !GetAtt ApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            # CachingDisabled — an API response is per-session and must never be
            # served to a second visitor.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewerExceptHostHeader — forwards cookies and auth headers while
            # letting CloudFront set Host to the Lambda URL, which SigV4 requires.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          # CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        DefaultRootObject: index.html
        # The SPA rewrite contract from HOSTING.md: every application route must
        # return index.html so the SpyneJS router can resolve it. 403 appears
        # alongside 404 because S3 with OAC returns AccessDenied for a key that
        # does not exist rather than NoSuchKey.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        # Z2FDTNDATAQYW2 is the fixed CloudFront hosted-zone id, the same in
        # every account and region.
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt Distribution.DomainName

Outputs:
  SiteUrl:
    Description: Public URL.
    Value: !Sub https://${DomainName}
  BucketName:
    Description: Upload the webpack build here, then invalidate the distribution.
    Value: !Ref SiteBucket
  DistributionId:
    Description: For `aws cloudfront create-invalidation`.
    Value: !Ref Distribution
